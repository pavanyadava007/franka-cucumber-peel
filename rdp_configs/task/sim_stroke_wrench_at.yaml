# Stage 1 of RDP (Asymmetric Tokenizer) for the simulated stroke skill. Mirrors
# third_party/rdp/reactive_diffusion_policy/config/task/real_peel_image_wrench_at_24fps.yaml, but for the peeler arm
# (right) with a 10-D action: tcp xyz + 6D rotation + gripper width.
name: sim_stroke_wrench_at
image_shape: [3, 96, 128]
dataset_path: data/rdp/peel_stroke_zarr

shape_meta: &shape_meta
  obs:
    right_robot_tcp_pose:
      shape: [9]
      type: low_dim
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  extended_obs:
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    shape: [10]

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_dataset.RealImageTactileDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  max_train_episodes: null
  delta_action: False
  relative_action: True
